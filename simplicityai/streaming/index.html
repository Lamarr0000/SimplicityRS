<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimplicityAI — streaming prototype</title>
<style>
:root{color-scheme:dark;font:16px/1.6 Segoe UI,sans-serif;background:#101722;color:#edf2ff}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#101722;border-bottom:1px solid #34445e;padding:16px 5%;display:flex;align-items:center;gap:10px;z-index:2}h1{font-size:23px;margin:0 auto 0 0}button{background:#213047;color:inherit;border:1px solid #465d80;border-radius:12px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button[aria-pressed=true]{background:#315b50}main{max-width:940px;margin:auto;padding:24px 24px 240px}.message{white-space:pre-wrap;margin:20px 0;padding:14px 0}.user{margin-left:12%;background:#284775;padding:16px 22px;border-radius:24px}.assistant{padding-right:8%}.copy{font-size:12px;padding:4px 10px;display:block;margin-top:10px}footer{position:fixed;bottom:0;background:#101722;width:100%;padding:12px 24px 20px}#composer{max-width:892px;margin:auto;border:1px solid #526b92;background:#1c293c;border-radius:24px;padding:14px}textarea{background:none;color:inherit;border:0;resize:none;width:100%;font:inherit;outline:none}#controls{display:flex;gap:8px}#send{margin-left:auto;background:#467fd7}#status{max-width:892px;margin:0 auto 10px;color:#b6c8e4;font-size:14px}dialog{width:min(850px,90vw);background:#172235;color:inherit;border:1px solid #526b92;border-radius:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}#partial{color:#b6c8e4;min-height:24px}small{font-size:12px;color:#b6c8e4}details{position:relative}nav{position:absolute;right:0;top:35px;background:#172235;padding:12px;border-radius:12px;width:190px}nav button{display:block;width:100%;margin:4px 0}
</style>
<header><h1>SimplicityAI</h1><button id="sound" aria-pressed="true">Sound on</button><button id="new">New chat</button><details><summary aria-label="Menu">•••</summary><nav><button id="activity">Activity and tools</button><button id="evidence">Measured evidence</button><small>Isolated streaming prototype</small></nav></details><button id="exit">Exit</button></header>
<main id="chat"><small>Offline streaming development build. Your working installation is separate.</small><div id="messages"></div><div id="partial"></div></main>
<footer><div id="status" role="status">Connecting…</div><form id="composer"><textarea id="text" rows="2" placeholder="Message SimplicityAI…" aria-label="Message"></textarea><div id="controls"><button type="button" id="talk" disabled aria-pressed="false">Talk</button><button type="button" id="mute" disabled aria-pressed="false">Mute mic</button><button type="button" id="stop">Stop reply</button><button id="send" disabled>Send</button></div></form></footer>
<dialog id="details"><button id="copy-details">Copy</button><button id="close-details">Close</button><pre id="detail-text"></pre></dialog>
<script src="client.js"></script></html>
